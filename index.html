<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alif Farhandriansyah — Portfolio Hub</title>
    <style>
        /* --- CONFIGURATION & DESIGN SYSTEM --- */
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #1e293b;
            --accent: #f59e0b;
            --accent-hover: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --glass-bg: rgba(30, 41, 59, 0.4);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        /* Alternate Interactive Themes */
        [data-theme="cyberpunk"] {
            --bg-primary: #0f051d;
            --bg-secondary: #1a0b2e;
            --accent: #00f0ff;
            --accent-hover: #70ffff;
            --text-main: #ffffff;
            --text-muted: #a855f7;
            --border-color: #4c1d95;
            --glass-bg: rgba(26, 11, 46, 0.5);
        }

        [data-theme="emerald"] {
            --bg-primary: #061f17;
            --bg-secondary: #0a3625;
            --accent: #10b981;
            --accent-hover: #34d399;
            --text-main: #ecfdf5;
            --text-muted: #6ee7b7;
            --border-color: #065f46;
            --glass-bg: rgba(10, 54, 37, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            scroll-behavior: smooth;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* --- NAVIGATION --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1.5px;
        }

        .logo span {
            color: var(--accent);
            transition: color 0.4s;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 15px;
            transition: color 0.3s;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--accent);
        }

        /* --- HERO BANNER --- */
        .hero {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 8%;
            text-align: center;
            background: radial-gradient(circle at top right, rgba(245, 158, 11, 0.05), transparent 45%);
            position: relative;
        }

        .hero-content {
            max-width: 800px;
            z-index: 2;
        }

        .hero-badge {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--accent);
            display: inline-block;
            margin-bottom: 25px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .hero h1 {
            font-size: 54px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 19px;
            color: var(--text-muted);
            margin-bottom: 35px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 35px;
            font-weight: 700;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* --- EXPERIENCE SECTION --- */
        .experience-section {
            padding: 90px 8%;
        }

        .section-header {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 50px;
        }

        .section-header h2 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-trigger {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-trigger.active {
            color: #000;
            background: var(--accent);
            border-color: var(--accent);
        }

        .tab-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            min-height: 350px;
            transition: background 0.4s;
        }

        .exp-display {
            animation: fadeIn 0.5s ease;
        }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .exp-title h3 {
            font-size: 24px;
            color: #fff;
            margin-bottom: 5px;
        }

        .exp-company {
            font-size: 16px;
            color: var(--accent);
            font-weight: 600;
        }

        .exp-meta {
            text-align: right;
            font-size: 14px;
            color: var(--text-muted);
        }

        .responsibilities {
            list-style: none;
            margin-bottom: 25px;
        }

        .responsibilities li {
            position: relative;
            padding-left: 25px;
            margin-bottom: 12px;
            color: var(--text-main);
            font-size: 15px;
        }

        .responsibilities li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: bold;
        }

        /* Skill Badges */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-badge {
            background: var(--bg-primary);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        /* --- THEME STUDIO --- */
        .studio-section {
            padding: 60px 8%;
            text-align: center;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .theme-triggers {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .theme-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .theme-btn:hover, .theme-btn.active {
            border-color: var(--accent);
            background: var(--glass-bg);
        }

        /* --- FOOTER --- */
        footer {
            background: #070a12;
            padding: 40px 8%;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 36px; }
            .exp-meta { text-align: left; }
            .tabs-nav { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <header>
        <div class="logo">ALIF<span>.</span>HUB</div>
        <nav>
            <ul>
                <li><a href="#home" class="active">Profil</a></li>
                <li><a href="#experience">Pengalaman</a></li>
                <li><a href="#studio">Tema</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <span class="hero-badge">SALES & OPERATIONS PROFESSIONAL</span>
            <h1>Alif Farhandriansyah</h1>
